[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-real-estate-agentic-chatbot"
version = "0.1.0"
description = "FastAPI agentic chatbot for Vietnamese real estate"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ingest = ["alembic>=1.13,<2", "sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]
