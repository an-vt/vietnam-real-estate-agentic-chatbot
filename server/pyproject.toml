[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-real-estate-agentic-chatbot"
version = "0.1.0"
description = "FastAPI starter for a Vietnam real estate chatbot"
requires-python = ">=3.10"
dependencies = ["fastapi[standard]"]

[tool.setuptools.packages.find]
where = ["src"]
