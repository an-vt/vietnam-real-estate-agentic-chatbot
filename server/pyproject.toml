[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-real-estate-agentic-chatbot"
version = "0.1.0"
description = "FastAPI agentic chatbot for Vietnamese real estate"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.16,<10",
    "fastapi>=0.115,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "openai>=1,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ingest = [
    "alembic>=1.13,<2",
    "tiktoken>=0.8,<1",
]
local = [
    "langchain-ollama>=1,<2",
    "sentence-transformers>=3,<6",
    "torch>=2.6,<2.7",
    "transformers>=4.41,<4.57",
]

[tool.setuptools.packages.find]
where = ["src"]
