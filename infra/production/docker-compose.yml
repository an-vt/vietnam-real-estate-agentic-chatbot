name: vietnam-real-estate-chatbot-production

services:
  backend:
    image: ${BACKEND_IMAGE}
    env_file: .env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    expose:
      - "8000"
    networks:
      - vietnam-real-estate-chatbot-net
    secrets:
      - postgres_password
      - llm_api_key
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE}
    # Named volumes are mounted root-owned by Docker; this short-lived
    # artifact copier needs root only to populate the shared static volume.
    user: "0:0"
    command: ["sh", "-c", "rm -rf /dist/* && cp -a /app/dist/. /dist/"]
    volumes:
      - frontend_dist:/dist
    networks:
      - vietnam-real-estate-chatbot-net
    restart: "no"

  nginx:
    image: nginx:alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/origin/origin.crt:/etc/nginx/tls/origin.crt:ro
      - ./secrets/origin/origin.key:/etc/nginx/tls/origin.key:ro
    networks:
      - vietnam-real-estate-chatbot-net
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  frontend_dist:

networks:
  vietnam-real-estate-chatbot-net:
    name: vietnam-real-estate-chatbot-net

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  llm_api_key:
    file: ./secrets/llm_api_key
