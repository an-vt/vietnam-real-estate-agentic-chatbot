name: vietnam-real-estate-chatbot-local

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vietnam_real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.backend
    command:
      - python
      - -Xfrozen_modules=off
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      - ollama
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "127.0.0.1:5678:5678"
    volumes:
      - ../../server:/app
      - huggingface_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  postgres_data:
  ollama_data:
  huggingface_cache:
