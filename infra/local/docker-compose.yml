name: vietnam-real-estate-chatbot-local

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../server:/app

  frontend:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
